  TikTok Pixel — codigo base (Biogradix)
  ======================================

  QUE ES
  Snippet oficial del pixel de TikTok (loader ttq). Registra automaticamente
  un evento de pagina (ttq.page()) en cada carga.

  ANTES DE USAR
  1. Reemplaza PIXEL_ID_PLACEHOLDER (aparece una sola vez, en ttq.load)
     por el Pixel ID real de TikTok Ads Manager
     (Assets > Events > Web Events > tu pixel > Settings).

  CUANDO Y DONDE PEGARLO
  2. Este archivo NO esta inyectado en ninguna pagina. La inyeccion se hace
     EN EL MERGE (dia de lanzamiento), desde la sesion que controla el merge,
     porque las paginas de producto pertenecen a la rama phase-1-checkout.
  3. En el merge: pega el bloque <script> completo justo ANTES de </head>
     en TODAS las paginas publicas (index, producto-*, quiz, blog*, tecnologia,
     educacion, contacto, gracias). NO pegarlo en admin.html.

  EVENTOS ADICIONALES (opcional, post-lanzamiento)
  Con el loader instalado se pueden disparar eventos manuales, por ejemplo:
    ttq.track('CompletePayment', { value: 350.00, currency: 'USD' });
  en la pagina de gracias, o ttq.track('AddToCart') en los botones de compra.
-->
